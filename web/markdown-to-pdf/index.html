<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Primary SEO -->
  <title>MarkForge - Free Markdown to PDF Converter | Mausam Giri Tools</title>
  <meta name="description" content="Convert Markdown to HTML and PDF in your browser. Live preview, custom CSS, real-time page-break simulation, and instant PDF export." />
  <meta name="keywords" content="markdown to pdf, markdown to html, md to pdf, pdf converter, custom css markdown, live markdown preview, export pdf, MarkForge, Mausam Giri" />
  <meta name="author" content="Mausam Giri" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0c0e14" />
  <meta name="color-scheme" content="dark" />

  <link rel="canonical" href="https://tools.mausamgiri.in/markdown-to-pdf/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Google Fonts: Industrial Obsidian Editorial -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/hint/show-hint.min.css" />
  <link rel="stylesheet" href="static/app.css" />
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <a class="brand-home" href="/" title="All tools">← CONSOLE</a>
        <span class="mark" aria-hidden="true">MF</span>
        <div class="brand-text">
          <strong>MARKFORGE</strong>
          <span>MARKDOWN → HTML → PDF</span>
        </div>
      </div>

      <div class="document-name" aria-label="Document Name">
        <label for="document-name" class="document-name-label">
          NAME
        </label>
        <input type="text" id="document-name" placeholder="Document Name">
      </div>

      <div class="toolbar">
        <div class="panel-toggle-group" role="radiogroup" aria-label="Pane visibility mode">
          <button type="button" class="panel-toggle-btn active btn btn-secondary" data-mode="split" role="radio"
            aria-checked="true" title="Split view (Editor + Preview)">
            <span class="material-symbols-outlined icon-sm">splitscreen</span>
            <span class="btn-label">Split</span>
          </button>
          <button type="button" class="panel-toggle-btn btn btn-secondary" data-mode="editor" role="radio"
            aria-checked="false" title="Editor only">
            <span class="material-symbols-outlined icon-sm">edit_note</span>
            <span class="btn-label">Editor</span>
          </button>
          <button type="button" class="panel-toggle-btn btn btn-secondary" data-mode="preview" role="radio"
            aria-checked="false" title="Preview only">
            <span class="material-symbols-outlined icon-sm">visibility</span>
            <span class="btn-label">Preview</span>
          </button>
        </div>

        <label class="field-inline">
          <span>PAGE</span>
          <select id="page-size" title="PDF page size">
            <option value="a4" selected>A4</option>
            <option value="letter">Letter</option>
          </select>
        </label>

        <button type="button" class="btn btn-primary" id="btn-export" title="Download as PDF">
          <span class="material-symbols-outlined icon-btn">picture_as_pdf</span>
          <span>EXPORT PDF</span>
        </button>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <section class="pane editor-pane" aria-label="Editors">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="markdown">
            <span class="material-symbols-outlined icon-tab">edit</span>
            <span>MARKDOWN</span>
          </button>
          <button type="button" class="tab" role="tab" aria-selected="false" data-tab="css">
            <span class="material-symbols-outlined icon-tab">css</span>
            <span>CUSTOM CSS</span>
          </button>
          <div class="tabs-spacer"></div>
          <button type="button" class="btn-text" id="btn-reset" title="Restore sample content">
            <span class="material-symbols-outlined icon-tab">restart_alt</span>
            <span>RESET</span>
          </button>
        </div>

        <div id="md-toolbar" class="md-toolbar" role="toolbar" aria-label="Markdown formatting">
          <div class="md-group">
            <button type="button" class="md-btn" data-md="bold" title="Bold (Ctrl+B)">
              <span class="material-symbols-outlined icon-md">format_bold</span>
            </button>
            <button type="button" class="md-btn" data-md="italic" title="Italic (Ctrl+I)">
              <span class="material-symbols-outlined icon-md">format_italic</span>
            </button>
            <button type="button" class="md-btn" data-md="strike" title="Strikethrough">
              <span class="material-symbols-outlined icon-md">strikethrough_s</span>
            </button>
            <button type="button" class="md-btn" data-md="highlight" title="Highlight">
              <span class="material-symbols-outlined icon-md">ink_highlighter</span>
            </button>
          </div>

          <div class="md-group">
            <button type="button" class="md-btn" data-md="h1" title="Heading 1">H1</button>
            <button type="button" class="md-btn" data-md="h2" title="Heading 2">H2</button>
            <button type="button" class="md-btn" data-md="h3" title="Heading 3">H3</button>
            <button type="button" class="md-btn" data-md="h4" title="Heading 4">H4</button>
          </div>

          <div class="md-group">
            <button type="button" class="md-btn" data-md="link" title="Link (Ctrl+K)">
              <span class="material-symbols-outlined icon-md">link</span>
            </button>
            <button type="button" class="md-btn" data-md="image" title="Image">
              <span class="material-symbols-outlined icon-md">image</span>
            </button>
            <button type="button" class="md-btn" data-md="code" title="Inline code">
              <span class="material-symbols-outlined icon-md">code</span>
            </button>
            <button type="button" class="md-btn" data-md="codeblock" title="Code block">
              <span class="material-symbols-outlined icon-md">terminal</span>
            </button>
          </div>

          <div class="md-group">
            <button type="button" class="md-btn" data-md="quote" title="Blockquote">
              <span class="material-symbols-outlined icon-md">format_quote</span>
            </button>
            <button type="button" class="md-btn" data-md="ul" title="Bullet list">
              <span class="material-symbols-outlined icon-md">format_list_bulleted</span>
            </button>
            <button type="button" class="md-btn" data-md="ol" title="Numbered list">
              <span class="material-symbols-outlined icon-md">format_list_numbered</span>
            </button>
            <button type="button" class="md-btn" data-md="task" title="Task list">
              <span class="material-symbols-outlined icon-md">check_box</span>
            </button>
          </div>

          <div class="md-group">
            <button type="button" class="md-btn" data-md="table" title="Table">
              <span class="material-symbols-outlined icon-md">table_chart</span>
            </button>
            <button type="button" class="md-btn" data-md="hr" title="Horizontal rule">
              <span class="material-symbols-outlined icon-md">horizontal_rule</span>
            </button>
            <button type="button" class="md-btn" data-md="mermaid" title="Mermaid Diagram">
              <span class="material-symbols-outlined icon-md">schema</span>
            </button>
            <button type="button" class="md-btn" data-md="pagebreak" title="Insert Manual Page Break">
              <span class="material-symbols-outlined icon-md">insert_page_break</span>
            </button>
            <button type="button" class="md-btn" data-md="footnote" title="Footnote">
              <span class="material-symbols-outlined icon-md">subscript</span>
            </button>
            <button type="button" class="md-btn" data-md="toc" title="Table of contents">
              <span class="material-symbols-outlined icon-md">toc</span>
            </button>
          </div>
        </div>

        <textarea id="markdown-input" class="code-area active" spellcheck="false" aria-label="Markdown source"
          placeholder="Write markdown…"></textarea>

        <div id="css-editor-host" class="code-area css-editor-host">
          <textarea id="css-input" spellcheck="false" aria-label="Custom CSS"
            placeholder="Customize document styles…"></textarea>
        </div>
      </section>

      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>

      <section class="pane preview-pane" aria-label="Live preview">
        <div class="preview-meta">
          <div class="preview-title-group">
            <span>LIVE PREVIEW</span>
            <span id="preview-stats" class="muted">0 words</span>
          </div>
          <div class="view-toggle-group" role="radiogroup" aria-label="Preview view mode">
            <button type="button" class="view-toggle-btn active btn btn-secondary" data-view="normal" role="radio"
              aria-checked="true" title="Normal continuous document view">
              <span class="material-symbols-outlined icon-sm">article</span>
              <span>NORMAL</span>
            </button>
            <button type="button" class="view-toggle-btn btn btn-secondary" data-view="pagebreak" role="radio"
              aria-checked="false" title="Real-time page break simulation matching PDF export">
              <span class="material-symbols-outlined icon-sm">view_compact</span>
              <span>PAGE BREAKS</span>
            </button>
          </div>
        </div>

        <div class="preview-stage" id="preview-stage">
          <article id="html-preview" class="markdown-body page-sheet"></article>
          <div id="pagebreak-preview" class="pagebreak-container" style="display: none;"></div>
        </div>
      </section>
    </main>
  </div>

  <style id="user-styles"></style>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/css/css.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/hint/show-hint.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/hint/css-hint.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/edit/closebrackets.min.js" defer></script>
  <script src="static/app.js" defer></script>
</body>
</html>
